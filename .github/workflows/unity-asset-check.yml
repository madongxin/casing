# 复制到 Unity 仓库根目录: .github/workflows/unity-asset-check.yml
# 仓库示例: madongxin/casing 或 madongxin/tianlongasset

name: Unity Asset Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: unity-asset-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batchmode-check:
    name: BatchMode + Agent
    runs-on: ubuntu-latest   # game-ci 使用 Linux 容器跑 Unity，无需自建 Windows Runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      # Linux headless 无法解码 QuickTime .mov，FPS 教程视频会导致 import 报错
      - name: Strip CI-incompatible tutorial videos
        run: |
          find Assets -type f \( -iname '*.mov' -o -iname '*.mp4' \) -print -delete || true

      # Unity 版本自动读 ProjectSettings/ProjectVersion.txt
      - name: Unity BatchMode Asset Check
        uses: game-ci/unity-builder@v4
        id: unity-build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          # 工程为 2022.3.62f3c1（团结/中国版后缀），game-ci 仅提供国际版 2022.3.62f1
          unityVersion: 2022.3.62f1
          targetPlatform: StandaloneLinux64
          # game-ci 已通过 -executeMethod 调用 buildMethod，勿在 customParameters 再写 -executeMethod
          buildMethod: Ci.AssetCheckBatch.Run
          customParameters: -logFile unity-check.log
          versioning: None
          allowDirtyBuild: true

      - name: Upload BatchMode report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-asset-report
          path: ci-asset-report.json
          if-no-files-found: ignore

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-check-log
          path: |
            unity-check.log
            Logs/
          if-no-files-found: ignore

      # 将 BatchMode 全量扫描结果写入 Agent 看板
      - name: Submit BatchMode report to Agent
        if: always()
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          if [ -z "$AGENT_URL" ] || [ -z "$AGENT_TOKEN" ]; then
            echo "Skip: AGENT_URL or AGENT_TOKEN not configured"
            exit 0
          fi
          if [ ! -f ci-asset-report.json ]; then
            echo "Skip: ci-asset-report.json not found"
            exit 0
          fi
          # 报告可能很大，勿用 --argjson "$(cat ...)"（会触发 Argument list too long）
          jq -n \
            --arg sha "${{ github.sha }}" \
            --slurpfile report ci-asset-report.json \
            '{commit_sha: $sha, report: $report[0]}' > ci-report-payload.json
          curl -sf --connect-timeout 15 --max-time 120 -X POST "${AGENT_URL}/api/unity/ci/report" \
            -H "Authorization: Bearer ${AGENT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @ci-report-payload.json \
            || echo "Warning: failed to submit BatchMode report"

      # 通知 Linux 服务器 Agent：对该 commit 做 Git 规则 + RAG 检查
      - name: Trigger Linux Review Agent
        if: always()
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          if [ -z "$AGENT_URL" ] || [ -z "$AGENT_TOKEN" ]; then
            echo "Skip: AGENT_URL or AGENT_TOKEN not configured"
            exit 0
          fi
          curl -sf --connect-timeout 15 --max-time 30 -X POST "${AGENT_URL}/api/unity/checks" \
            -H "Authorization: Bearer ${AGENT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\": \"${{ github.sha }}\"}" \
            || echo "Warning: Agent unreachable (start docker on Linux server)"
